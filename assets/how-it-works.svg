<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 360" width="1280" height="360" role="img" aria-labelledby="t d">
  <title id="t">How push-guard works</title>
  <desc id="d">Four steps: you ask if it's safe to push, Claude scans files, git history and .gitignore, you get a red, yellow and green report with a verdict, then you fix things together and Claude asks before every change.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#0f1d2b"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#2dd4bf"/>
    </marker>
  </defs>
  <rect width="1280" height="360" rx="24" fill="url(#bg)"/>

  <g font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">
    <text x="640" y="56" text-anchor="middle" font-size="26" font-weight="700" fill="#eef6ff">How it works</text>

    <!-- step 1 -->
    <g transform="translate(48 92)">
      <rect width="262" height="224" rx="16" fill="#101b2b" stroke="#1f3247"/>
      <circle cx="36" cy="38" r="18" fill="#2dd4bf"/>
      <text x="36" y="45" text-anchor="middle" font-size="20" font-weight="800" fill="#0b1220">1</text>
      <text x="66" y="46" font-size="22" font-weight="700" fill="#eef6ff">You ask</text>
      <rect x="20" y="78" width="222" height="58" rx="10" fill="#0b1220" stroke="#1f3247"/>
      <text x="36" y="104" font-size="16" fill="#c4d3e3">“can I make this</text>
      <text x="36" y="125" font-size="16" fill="#c4d3e3">repo public?”</text>
      <text x="20" y="170" font-size="15" fill="#94a9c0">No commands to learn.</text>
      <text x="20" y="192" font-size="15" fill="#94a9c0">Just ask in plain words.</text>
    </g>

    <!-- step 2 -->
    <g transform="translate(354 92)">
      <rect width="262" height="224" rx="16" fill="#101b2b" stroke="#1f3247"/>
      <circle cx="36" cy="38" r="18" fill="#2dd4bf"/>
      <text x="36" y="45" text-anchor="middle" font-size="20" font-weight="800" fill="#0b1220">2</text>
      <text x="66" y="46" font-size="22" font-weight="700" fill="#eef6ff">Claude scans</text>
      <g font-size="16" fill="#c4d3e3">
        <text x="24" y="92">▸ every file you'd push</text>
        <text x="24" y="120">▸ the whole git history</text>
        <text x="24" y="148">▸ your .gitignore</text>
        <text x="24" y="176">▸ commit emails</text>
      </g>
      <text x="24" y="206" font-size="14" fill="#5b7088">read-only · nothing leaves your PC</text>
    </g>

    <!-- step 3 -->
    <g transform="translate(660 92)">
      <rect width="262" height="224" rx="16" fill="#101b2b" stroke="#1f3247"/>
      <circle cx="36" cy="38" r="18" fill="#2dd4bf"/>
      <text x="36" y="45" text-anchor="middle" font-size="20" font-weight="800" fill="#0b1220">3</text>
      <text x="66" y="46" font-size="22" font-weight="700" fill="#eef6ff">You get a report</text>
      <circle cx="34" cy="88" r="8" fill="#ef4444"/>
      <text x="52" y="94" font-size="16" fill="#c4d3e3">must fix: keys, .env…</text>
      <circle cx="34" cy="122" r="8" fill="#facc15"/>
      <text x="52" y="128" font-size="16" fill="#c4d3e3">check: emails, paths…</text>
      <circle cx="34" cy="156" r="8" fill="#4ade80"/>
      <text x="52" y="162" font-size="16" fill="#c4d3e3">clean: all good</text>
      <text x="24" y="200" font-size="16" font-weight="700" fill="#eef6ff">+ a clear verdict</text>
    </g>

    <!-- step 4 -->
    <g transform="translate(966 92)">
      <rect width="262" height="224" rx="16" fill="#101b2b" stroke="#2dd4bf" stroke-opacity="0.6"/>
      <circle cx="36" cy="38" r="18" fill="#4ade80"/>
      <text x="36" y="45" text-anchor="middle" font-size="20" font-weight="800" fill="#0b1220">4</text>
      <text x="66" y="46" font-size="22" font-weight="700" fill="#eef6ff">Fix together</text>
      <g font-size="15" fill="#c4d3e3">
        <text x="24" y="92">.gitignore rules</text>
        <text x="24" y="118">move keys to env vars</text>
        <text x="24" y="144">git rm --cached</text>
        <text x="24" y="170">“rotate this key” links</text>
      </g>
      <text x="24" y="204" font-size="14" font-weight="600" fill="#4ade80">asks before every change</text>
    </g>

    <g stroke="#2dd4bf" stroke-width="3" fill="none" marker-end="url(#arrow)">
      <path d="M314 204 H348"/>
      <path d="M620 204 H654"/>
      <path d="M926 204 H960"/>
    </g>
  </g>
</svg>
